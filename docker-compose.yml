services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"

  # Proxy con HTTPS automático (Let's Encrypt). Define DOMAIN en .env
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
